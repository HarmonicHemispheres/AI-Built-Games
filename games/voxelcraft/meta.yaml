# Identity
slug: voxelcraft
title: VoxelCraft
tagline: An infinite cubic adventure with procedural terrain, biomes, and freeform building.
description: |
  A browser-based voxel sandbox built as a single HTML file. Explore a procedurally
  generated world with plains, forests, mesas, and mountains, break and place
  blocks with a rotating hotbar, navigate with a live minimap, and save or load
  persistent worlds as JSON files.

