# Player-facing content
features:
  - Procedurally generated voxel world with multiple biomes and landmarks
  - Block placement, block breaking, and rotation-aware building pieces
  - Hotbar and drag-and-drop inventory management
  - Live minimap, world stats, and in-game settings panel
  - Save and load support for persistent worlds via downloadable JSON files
  - Save data preserves world edits, player state, hotbar setup, stats, and tree growth timers
  - Water, foliage motion, and tree growth systems for added world activity

controls:
  - WASD to move and mouse to look around
  - Left click to break blocks and right click to place blocks
  - Mouse wheel or number keys to change the selected hotbar slot
  - E to open inventory and R to rotate placeable blocks
  - Space to jump and double-tap Space to fly
  - Use LOAD GAME on the title screen and SAVE GAME from the pause menu