# Detail page content
description: >
  Clicky Empire blends three loops into short, replayable runs. Click tiles to
  harvest gold, wood, iron, and food; spend them to place buildings and raise an
  economy; then survive escalating attack waves that path toward your castle. Each
  round you draft a new card from a permanently-growing collection. Rendered in true
  3D low-poly with Three.js on a seeded, fog-of-war map you expand at your own risk.
  Lose the castle and the run ends — survive as long as you can.
features:
  - Three genres in one — clicker, city-builder, and roguelite
  - True 3D low-poly world rendered with Three.js (no build step)
  - Golden-hour diorama rendering — ACES tone mapping, image-based lighting, gradient sky and fog, ambient occlusion, and soft bloom via an addon post-processing stack
  - Living world — wind-swayed trees and shader-animated flowing water
  - Eased orbit camera (pan / zoom / 90° yaw turns glide instead of snapping)
  - Seeded, shareable procedural maps with fog-of-war expansion
  - Card drafting across tiers with permanent between-run unlocks
  - Total-War-style regiments of soldiers whose block thins as the unit takes damage
  - Tier-gated build menu through Tier 3 (keep, wizard tower, castle wall), with terrain-gated placement (lumber/sawmill near forest, mines on ore veins)
  - A gold economy you grow — upgrade hamlets into villages and cities in place, each paying more rent
  - Spawner buildings (militia camp, barracks, archery range) that consume food to train units, with a segmented production bar capped to their living-unit count
  - Food matters — it both pays unit upkeep each round and fuels every unit you train (cards and spawner buildings)
  - Two-phase loop: build your economy, then DEFEND against the wave
controls:
  - Left-click — harvest a tile / select a unit (your army fights enemies, not your cursor)
  - Left-drag — box-select units (a selection rectangle follows the cursor)
  - Shift-click or shift-drag — add units to the current selection
  - Right-click — move or attack-move selected units
  - Click a card to play it; BUILD opens the build menu; click fog tiles to expand
  - Hover a tile to see its name; WASD / edge-scroll / middle-drag — pan · wheel — zoom · Q / E — rotate
  - DEFEND — end the build phase early and start the wave
