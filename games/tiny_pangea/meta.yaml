# Identity
slug: tiny_pangea
title: Tiny Pangea
tagline: A cozy god-mode civilization sim on a tiny procedural island.
description: |
  Tiny Pangea is a cozy isometric god-mode civilization sandbox. Generate a
  procedural island, scatter trees, animals, and buildings, then watch a tiny
  ecosystem and civilization play out on a square-tile grid. You don't control
  any single character — everything you place navigates the world on its own.

