<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0c0"/>
      <stop offset="1" stop-color="#9fb98a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e9a4a"/>
      <stop offset="1" stop-color="#4f7a36"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67b3d6"/>
      <stop offset="1" stop-color="#2f6f96"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="980" cy="100" r="48" fill="#f2c14e" opacity="0.85"/>
  <!-- distant hills -->
  <path d="M0 230 Q 200 170 420 220 T 820 210 T 1200 220 V480 H0 Z" fill="#7fa05a" opacity="0.55"/>
  <rect x="0" y="250" width="1200" height="230" fill="url(#ground)"/>

  <!-- river -->
  <path d="M120 480 C 220 360 180 320 320 260 S 520 220 620 150 L 700 120"
        fill="none" stroke="url(#water)" stroke-width="46" stroke-linecap="round" opacity="0.92"/>

  <!-- isometric cabins -->
  <g transform="translate(520,300)">
    <polygon points="0,40 60,75 120,40 60,5" fill="#d8b98a" stroke="#5a3318" stroke-width="2"/>
    <polygon points="0,40 0,75 60,110 60,75" fill="#b79a6a" stroke="#5a3318" stroke-width="2"/>
    <polygon points="120,40 120,75 60,110 60,75" fill="#a07f54" stroke="#5a3318" stroke-width="2"/>
    <polygon points="0,40 60,5 120,40 60,-30" fill="#8a4b2a" stroke="#3a2110" stroke-width="2"/>
  </g>
  <g transform="translate(360,350) scale(0.8)">
    <polygon points="0,40 60,75 120,40 60,5" fill="#d8b98a" stroke="#5a3318" stroke-width="2"/>
    <polygon points="0,40 0,75 60,110 60,75" fill="#b79a6a" stroke="#5a3318" stroke-width="2"/>
    <polygon points="120,40 120,75 60,110 60,75" fill="#a07f54" stroke="#5a3318" stroke-width="2"/>
    <polygon points="0,40 60,5 120,40 60,-30" fill="#9a3320" stroke="#3a2110" stroke-width="2"/>
  </g>
  <!-- smoke -->
  <g fill="#eeeeee" opacity="0.6">
    <circle cx="610" cy="250" r="9"/><circle cx="618" cy="232" r="11"/><circle cx="608" cy="212" r="13"/>
  </g>

  <!-- pine trees -->
  <g>
    <g transform="translate(760,330)"><polygon points="0,0 22,40 -22,40" fill="#3f6a2c"/><polygon points="0,18 26,62 -26,62" fill="#4f7a36"/><rect x="-5" y="62" width="10" height="14" fill="#6b4426"/></g>
    <g transform="translate(820,360) scale(0.85)"><polygon points="0,0 22,40 -22,40" fill="#3f6a2c"/><polygon points="0,18 26,62 -26,62" fill="#4f7a36"/><rect x="-5" y="62" width="10" height="14" fill="#6b4426"/></g>
    <g transform="translate(250,330) scale(1.1)"><polygon points="0,0 22,40 -22,40" fill="#365024"/><polygon points="0,18 26,62 -26,62" fill="#4f7a36"/><rect x="-5" y="62" width="10" height="14" fill="#6b4426"/></g>
  </g>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="92" fill="#f4e7c3" stroke="#3a2110" stroke-width="3" font-weight="bold"
        style="paint-order:stroke">Frontier &amp; Fire</text>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="30" fill="#3a2110">A settlement on the eve of revolution</text>
</svg>
