# Player-facing content
features:
  - Two asymmetric factions — Enterprise (wealth) and the People (population & standing)
  - Procedurally generated wilderness with forests, rivers, rock, and fertile soil
  - Isometric tile-space building grid with footprints, roads, and terrain adjacency
  - Production chains — extract raw goods, refine them, and sell for profit
  - Living world — flowing water, swaying trees, chimney smoke, seasons, and weather
  - Turning seasons that shift production, food demand, and the palette
  - Decision-card events tied to the coming revolution
  - Supply-and-demand markets, morale, population growth, and failure states
  - Main menu, faction select, settings, lifetime stats, and an in-world Almanac
  - localStorage autosave with full save/load

controls:
  - Left-click a building in the dock, then click the map to place it
  - Click a placed building to inspect, pause, or demolish it
  - Drag the map to pan, or use arrow keys / WASD to scroll the view
  - Scroll to zoom, R / Q to rotate the camera
  - Spacebar to pause; 1 / 2 / 3 to set game speed
