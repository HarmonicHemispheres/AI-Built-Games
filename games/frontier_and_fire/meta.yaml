# Identity
slug: frontier-and-fire
title: Frontier & Fire
tagline: An isometric colonial-era settlement builder on the eve of the American Revolution.
description: |
  A single-file, isometric settlement-builder set on the 1760s–70s frontier.
  Play as the Colonial Frontiersman building a trading enterprise in £ sterling,
  or the Native Confederacy growing population and standing. Gather raw goods,
  refine them, trade for profit, feed your people, and survive the turning
  seasons — without going bankrupt or letting your settlement collapse.

