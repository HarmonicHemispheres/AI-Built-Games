# Player-facing content
features:
  - Procedurally generated tile-based islands with seed and size controls
  - Cozy top-down isometric view with vignette and soft edge blur
  - Place plants, animals, residences, and industry from a sidebar tray
  - Inspector panel shows live details for any selected tile or entity
  - Animals wander, eat, breed, and flee predators on their own
  - Buildings produce, consume, and route workers across the island
  - Homes upgrade through three tiers as access to food and luxuries grows
  - WASD pan, Q/E rotate, left-click to select or place

controls:
  - WASD to pan the camera across the island
  - Q and E to rotate the camera left and right
  - Left click on a tile or thing to select and inspect it
  - Pick a thing from the left sidebar tray and click a tile to place it
  - Right click or press Escape to cancel placement
